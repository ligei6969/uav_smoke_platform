server:
  port: 8080

spring:
  application:
    name: uav-video-platform
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/uav_smoke_platform?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 2GB
      max-request-size: 2GB
  thymeleaf:
    cache: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

app:
  storage:
    video-root: storage/videos
  analysis:
    base-url: ${SMOKE_ANALYSIS_URL:http://127.0.0.1:8000}
    connect-timeout: 5s
    request-timeout: 30m
  map:
    provider: ${MAP_PROVIDER:maplibre}
    style: ${MAP_STYLE:osm}
    map-tiler-api-key: ${MAPTILER_API_KEY:}
    map-libre-module-url: https://unpkg.com/maplibre-gl@6.2.0/dist/maplibre-gl.mjs
    map-libre-stylesheet-url: https://unpkg.com/maplibre-gl@6.2.0/dist/maplibre-gl.css
    osm-tile-url: https://tile.openstreetmap.org/{z}/{x}/{y}.png
    osm-attribution: © OpenStreetMap contributors
    map-tiler-satellite-style-url: https://api.maptiler.com/maps/satellite/style.json?key={key}
    center-latitude: ${UAV_CENTER_LATITUDE:31.2304}
    center-longitude: ${UAV_CENTER_LONGITUDE:121.4737}
    zoom: ${MAP_ZOOM:15}
  telemetry:
    enabled: ${TELEMETRY_SIMULATION_ENABLED:true}
    interval-ms: ${TELEMETRY_INTERVAL_MS:1000}
    max-track-points: ${TELEMETRY_MAX_TRACK_POINTS:600}
    center-latitude: ${UAV_CENTER_LATITUDE:31.2304}
    center-longitude: ${UAV_CENTER_LONGITUDE:121.4737}
  geolocation:
    horizontal-fov-deg: ${CAMERA_HORIZONTAL_FOV_DEG:84.0}
    detection-window-sec: ${GEOLOCATION_DETECTION_WINDOW_SEC:0.75}
    recheck-radius-m: ${RECHECK_RADIUS_M:50.0}
    recheck-altitude-m: ${RECHECK_ALTITUDE_M:65.0}
    max-detection-artifact-bytes: ${MAX_DETECTION_ARTIFACT_BYTES:52428800}
