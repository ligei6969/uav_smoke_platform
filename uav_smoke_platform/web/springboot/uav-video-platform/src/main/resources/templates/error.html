<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>请求处理失败</title>
    <link rel="stylesheet" href="/webjars/bootstrap/5.3.8/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">UAV VIDEO</a>
    </div>
</nav>
<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card p-5 text-center">
                <div class="display-2 fw-bold text-secondary" th:text="${status}">500</div>
                <h1 class="h3 mt-3" th:text="${error}">请求处理失败</h1>
                <p class="text-secondary" th:text="${message}">服务器处理请求失败</p>
                <div>
                    <a class="btn btn-primary" href="/">返回首页</a>
                    <a class="btn btn-outline-secondary" href="/videos">返回视频库</a>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
