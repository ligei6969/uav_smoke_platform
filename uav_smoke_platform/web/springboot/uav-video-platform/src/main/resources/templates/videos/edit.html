<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>编辑视频</title>
    <link rel="stylesheet" href="/webjars/bootstrap/5.3.8/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">UAV VIDEO</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/monitor">实时监控</a>
            <a class="nav-link" href="/videos">视频库</a>
            <a class="nav-link" href="/videos/upload">上传视频</a>
        </div>
    </div>
</nav>
<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="mb-4">
                <a class="small text-decoration-none"
                   th:href="@{/videos/{id}(id=${video.id})}">← 返回详情</a>
                <h1 class="h2 mt-2">编辑视频信息</h1>
                <p class="text-secondary" th:text="${video.originalFilename}"></p>
            </div>
            <div class="card p-4 p-md-5">
                <form th:action="@{/videos/{id}/edit(id=${video.id})}"
                      th:object="${form}" method="post">
                    <div class="mb-4">
                        <label class="form-label fw-semibold" for="title">标题</label>
                        <input class="form-control" id="title" type="text" th:field="*{title}"
                               maxlength="200" required>
                        <div class="text-danger small mt-1"
                             th:if="${#fields.hasErrors('title')}"
                             th:errors="*{title}"></div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold" for="description">描述</label>
                        <textarea class="form-control" id="description" rows="6"
                                  th:field="*{description}" maxlength="5000"></textarea>
                        <div class="text-danger small mt-1"
                             th:if="${#fields.hasErrors('description')}"
                             th:errors="*{description}"></div>
                    </div>
                    <button class="btn btn-primary" type="submit">保存修改</button>
                    <a class="btn btn-link"
                       th:href="@{/videos/{id}(id=${video.id})}">取消</a>
                </form>
            </div>
        </div>
    </div>
</main>
</body>
</html>
