<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>无人机视频平台</title>
    <link rel="stylesheet" href="/webjars/bootstrap/5.3.8/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">UAV VIDEO</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/monitor">实时监控</a>
            <a class="nav-link" href="/videos">视频库</a>
            <a class="nav-link" href="/videos/upload">上传视频</a>
        </div>
    </div>
</nav>
<main class="container py-5">
    <section class="hero p-5 mb-4">
        <div class="row align-items-center g-4">
            <div class="col-lg-8">
                <p class="text-uppercase small mb-2">V0.6 · Realtime Monitoring</p>
                <h1 class="display-5 fw-bold">无人机烟雾分析平台</h1>
                <p class="lead mb-4">实时查看无人机位置、飞行轨迹、烟雾目标和复查航点。</p>
                <a class="btn btn-light btn-lg me-2" href="/monitor">进入实时监控</a>
                <a class="btn btn-outline-light btn-lg" href="/videos">浏览视频</a>
            </div>
            <div class="col-lg-4">
                <div class="bg-white bg-opacity-10 rounded-4 p-4 text-center">
                    <div class="display-3 fw-bold" th:text="${videoCount}">0</div>
                    <div>当前有效视频</div>
                </div>
            </div>
        </div>
    </section>
    <div class="row g-4">
        <div class="col-md-4">
            <div class="card h-100 p-4">
                <h2 class="h5">本地安全存储</h2>
                <p class="text-secondary mb-0">视频与数据库元信息分离，磁盘路径不暴露给客户端。</p>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card h-100 p-4">
                <h2 class="h5">实时位置与轨迹</h2>
                <p class="text-secondary mb-0">通过 SSE 接收无人机遥测，并在地图上持续更新位置和航迹。</p>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card h-100 p-4">
                <h2 class="h5">目标与复查任务</h2>
                <p class="text-secondary mb-0">同时查看烟雾目标、识别准确率和模拟复查航点。</p>
            </div>
        </div>
    </div>
</main>
</body>
</html>
