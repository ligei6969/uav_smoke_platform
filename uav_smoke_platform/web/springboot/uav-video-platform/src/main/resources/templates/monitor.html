<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>无人机实时监控</title>
    <link rel="stylesheet" href="/webjars/bootstrap/5.3.8/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/app.css?v=0.6.2">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid px-lg-4">
        <a class="navbar-brand" href="/">UAV VIDEO</a>
        <div class="navbar-nav ms-auto flex-row gap-2">
            <a class="nav-link active" href="/monitor">实时监控</a>
            <a class="nav-link" href="/videos">视频库</a>
            <a class="nav-link" href="/videos/upload">上传视频</a>
        </div>
    </div>
</nav>

<main class="container-fluid px-lg-4 py-4">
    <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-3">
        <div>
            <p class="text-uppercase text-secondary small mb-1">V0.6 · Realtime Telemetry</p>
            <h1 class="h3 mb-0">无人机实时监控</h1>
        </div>
        <div class="d-flex align-items-center gap-3">
            <div class="form-check form-switch mb-0">
                <input class="form-check-input" type="checkbox" role="switch" id="followUav" checked>
                <label class="form-check-label" for="followUav"
                       title="手动缩放或拖动地图时会自动关闭跟随">跟随无人机</label>
            </div>
            <span id="connectionStatus" class="badge text-bg-secondary">正在连接</span>
        </div>
    </div>

    <div id="mapWarning" class="alert alert-warning d-none" role="alert"></div>

    <div class="monitor-layout">
        <section class="card map-card" aria-label="无人机地图">
            <div class="map-shell">
                <div id="liveMap" class="live-map"></div>
                <div id="mapFallback" class="map-fallback d-none">
                    <div class="map-fallback-grid"></div>
                    <div class="map-fallback-content">
                        <span class="map-fallback-icon" aria-hidden="true">⌖</span>
                        <strong>地图暂不可用</strong>
                        <span id="mapFallbackReason">遥测数据仍会实时更新</span>
                    </div>
                </div>
                <div id="mapZoomControls" class="map-zoom-controls" aria-label="地图缩放控件">
                    <button id="mapZoomIn" type="button" title="放大地图" aria-label="放大地图">+</button>
                    <button id="mapZoomOut" type="button" title="缩小地图" aria-label="缩小地图">−</button>
                    <button id="mapRecenter" class="map-recenter" type="button" title="定位并跟随无人机">
                        定位
                    </button>
                </div>
                <div class="map-legend" aria-label="地图图例">
                    <span><i class="legend-dot legend-uav"></i>无人机</span>
                    <span><i class="legend-dot legend-smoke"></i>疑似烟雾目标</span>
                    <span><i class="legend-dot legend-waypoint"></i>任务航点</span>
                </div>
            </div>
        </section>

        <aside class="monitor-sidebar">
            <section class="card p-3 mb-3">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h2 class="h6 mb-0">实时遥测</h2>
                    <span id="dataSourceBadge" class="badge text-bg-info">模拟数据</span>
                </div>
                <div class="telemetry-grid">
                    <div><span>纬度</span><strong id="latitude">--</strong></div>
                    <div><span>经度</span><strong id="longitude">--</strong></div>
                    <div><span>高度</span><strong id="altitude">--</strong></div>
                    <div><span>速度</span><strong id="speed">--</strong></div>
                    <div><span>航向</span><strong id="heading">--</strong></div>
                    <div><span>云台俯仰</span><strong id="gimbalPitch">--</strong></div>
                </div>
                <div class="small text-secondary mt-3">
                    最后更新：<time id="lastUpdated">--</time>
                </div>
            </section>

            <section class="card p-3 mb-3">
                <h2 class="h6 mb-3">任务概况</h2>
                <dl class="mission-summary mb-0">
                    <div><dt>飞行轨迹点</dt><dd id="trackCount">0</dd></div>
                    <div><dt>疑似烟雾目标</dt><dd id="smokeCount">0</dd></div>
                    <div><dt>复查航点</dt><dd id="waypointCount">0</dd></div>
                    <div class="map-mode-row">
                        <dt><label for="mapModeSelect">地图显示</label></dt>
                        <dd>
                            <select id="mapModeSelect" class="form-select form-select-sm map-mode-select">
                                <option value="maplibre:osm">OSM 普通地图</option>
                                <option value="maplibre:satellite">卫星地图（需 MapTiler Key）</option>
                                <option value="none:osm">仅坐标，不显示地图</option>
                                <option value="google:osm">Google 地图（预留，未启用）</option>
                            </select>
                        </dd>
                    </div>
                </dl>
                <p id="mapModeStatus" class="small text-secondary mt-2 mb-0">正在读取地图配置</p>
            </section>

            <section class="card p-3">
                <h2 class="h6 mb-2">疑似烟雾目标列表</h2>
                <p class="target-score-help">
                    “模拟识别分数”表示演示检测器有多倾向于把该目标识别为烟雾。
                    当前数值是模拟数据，不是实际模型推理结果，也不代表火情严重程度。
                </p>
                <div id="smokeTargetList" class="target-list text-secondary small">等待数据</div>
            </section>
        </aside>
    </div>
</main>

<script type="module" src="/js/live-monitor.js?v=0.6.2"></script>
</body>
</html>
