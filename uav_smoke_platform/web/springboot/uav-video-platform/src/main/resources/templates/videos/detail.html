<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${video.title + ' - 视频详情'}">视频详情</title>
    <link rel="stylesheet" href="/webjars/bootstrap/5.3.8/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">UAV VIDEO</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/videos">视频库</a>
            <a class="nav-link" href="/videos/upload">上传视频</a>
        </div>
    </div>
</nav>
<main class="container py-5">
    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
    <div class="d-flex flex-wrap justify-content-between align-items-start gap-3 mb-4">
        <div>
            <a class="small text-decoration-none" href="/videos">← 返回视频库</a>
            <h1 class="h2 mt-2 mb-1" th:text="${video.title}"></h1>
            <div class="text-secondary" th:text="${video.originalFilename}"></div>
        </div>
        <div class="d-flex gap-2">
            <a class="btn btn-outline-primary"
               th:href="@{/videos/{id}/edit(id=${video.id})}">编辑</a>
            <form th:action="@{/videos/{id}/delete(id=${video.id})}" method="post"
                  onsubmit="return confirm('确定逻辑删除此视频并删除本地文件吗？');">
                <button class="btn btn-outline-danger" type="submit">删除</button>
            </form>
        </div>
    </div>
    <div class="card p-3 mb-4">
        <video class="video-player" controls preload="metadata">
            <source th:src="@{/media/videos/{id}(id=${video.id})}" type="video/mp4">
            当前浏览器不支持 HTML5 视频播放。
        </video>
    </div>
    <div class="row g-4">
        <div class="col-lg-8">
            <div class="card p-4 h-100">
                <h2 class="h5">视频描述</h2>
                <p class="description text-secondary mb-0"
                   th:text="${video.description ?: '暂无描述'}"></p>
            </div>
        </div>
        <div class="col-lg-4">
            <div class="card p-4 h-100">
                <h2 class="h5">元信息</h2>
                <dl class="row mb-0 small">
                    <dt class="col-5">视频 ID</dt>
                    <dd class="col-7" th:text="${video.id}"></dd>
                    <dt class="col-5">文件大小</dt>
                    <dd class="col-7"
                        th:text="${#numbers.formatInteger(video.fileSize, 1, 'COMMA') + ' B'}"></dd>
                    <dt class="col-5">媒体类型</dt>
                    <dd class="col-7" th:text="${video.contentType}"></dd>
                    <dt class="col-5">状态</dt>
                    <dd class="col-7" th:text="${video.status}"></dd>
                    <dt class="col-5">创建时间</dt>
                    <dd class="col-7"
                        th:text="${#temporals.format(video.createdAt, 'yyyy-MM-dd HH:mm')}"></dd>
                </dl>
            </div>
        </div>
    </div>
</main>
</body>
</html>
