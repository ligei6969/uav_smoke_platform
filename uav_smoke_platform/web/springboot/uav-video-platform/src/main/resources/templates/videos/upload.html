<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>上传视频</title>
    <link rel="stylesheet" href="/webjars/bootstrap/5.3.8/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">UAV VIDEO</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/monitor">实时监控</a>
            <a class="nav-link" href="/videos">视频库</a>
            <a class="nav-link active" href="/videos/upload">上传视频</a>
        </div>
    </div>
</nav>
<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="mb-4">
                <p class="text-uppercase text-secondary small mb-1">Upload</p>
                <h1 class="h2">上传视频</h1>
                <p class="text-secondary">仅支持非空 MP4 文件，单个请求最大 2GB。</p>
            </div>
            <div class="card p-4 p-md-5">
                <form th:action="@{/videos/upload}" th:object="${form}"
                      method="post" enctype="multipart/form-data">
                    <div class="mb-4">
                        <label class="form-label fw-semibold" for="file">MP4 文件</label>
                        <input class="form-control" id="file" type="file" th:field="*{file}"
                               accept="video/mp4,.mp4" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold" for="title">标题</label>
                        <input class="form-control" id="title" type="text" th:field="*{title}"
                               maxlength="200" placeholder="留空时使用原始文件名">
                        <div class="text-danger small mt-1"
                             th:if="${#fields.hasErrors('title')}"
                             th:errors="*{title}"></div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold" for="description">描述</label>
                        <textarea class="form-control" id="description" rows="5"
                                  th:field="*{description}" maxlength="5000"></textarea>
                        <div class="text-danger small mt-1"
                             th:if="${#fields.hasErrors('description')}"
                             th:errors="*{description}"></div>
                    </div>
                    <button class="btn btn-primary" type="submit">上传视频</button>
                    <a class="btn btn-link" href="/videos">取消</a>
                </form>
            </div>
        </div>
    </div>
</main>
</body>
</html>
