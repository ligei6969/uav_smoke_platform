<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>视频库</title>
    <link rel="stylesheet" href="/webjars/bootstrap/5.3.8/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">UAV VIDEO</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link active" href="/videos">视频库</a>
            <a class="nav-link" href="/videos/upload">上传视频</a>
        </div>
    </div>
</nav>
<main class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <p class="text-uppercase text-secondary small mb-1">Video Library</p>
            <h1 class="h2 mb-0">视频库</h1>
        </div>
        <a class="btn btn-primary" href="/videos/upload">上传 MP4</a>
    </div>
    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
    <div th:if="${#lists.isEmpty(videos)}" class="card p-5 text-center">
        <h2 class="h4">还没有视频</h2>
        <p class="text-secondary">上传第一个无人机 MP4 视频。</p>
        <div><a class="btn btn-primary" href="/videos/upload">立即上传</a></div>
    </div>
    <div th:unless="${#lists.isEmpty(videos)}" class="card overflow-hidden">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>ID</th>
                    <th>标题</th>
                    <th>原始文件名</th>
                    <th>大小</th>
                    <th>上传时间</th>
                    <th class="text-end">操作</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="video : ${videos}">
                    <td class="text-secondary" th:text="${video.id}"></td>
                    <td class="fw-semibold" th:text="${video.title}"></td>
                    <td th:text="${video.originalFilename}"></td>
                    <td th:text="${#numbers.formatInteger(video.fileSize, 1, 'COMMA') + ' B'}"></td>
                    <td th:text="${#temporals.format(video.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
                    <td class="text-end text-nowrap">
                        <a class="btn btn-sm btn-outline-primary"
                           th:href="@{/videos/{id}(id=${video.id})}">查看</a>
                        <a class="btn btn-sm btn-outline-secondary"
                           th:href="@{/videos/{id}/edit(id=${video.id})}">编辑</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
